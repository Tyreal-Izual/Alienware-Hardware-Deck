name: Windows checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and sensor contracts
        shell: powershell
        run: |
          ./Build.ps1 -OutputPath .local/build/HardwareDeck.exe
          ./Test.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Clean-checkout packaging
        shell: powershell
        run: ./tests/Packaging.Tests.ps1
      - name: WPF layout and refresh
        shell: powershell
        run: ./tests/Display.Tests.ps1
